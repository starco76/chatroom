<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Simple Chat</h2>

    <button onclick="createRoom()">Create Room</button>

    <div id="link"></div>

    <script>
        async function createRoom() {
            let res = await fetch("http://localhost:5000/create-room")
            let data = await res.json()

            document.getElementById("link").innerHTML =
                `<a href="room.html?room=${data.room_id}">Enter Chat</a>`
        }
    </script>

</body>

</html>
